spring:
  application:
    name: status-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/status}
    username: ${SPRING_DATASOURCE_USERNAME:status}
    password: ${SPRING_DATASOURCE_PASSWORD:status}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # Overload must never take readiness DOWN: a status monitor that is
          # reported unready would be rescheduled by the orchestrator mid-outage.
          exclude: probeCapacity
        capacity:
          # Non-fatal capacity signal (always UP; see ProbeCapacityHealthIndicator).
          include: probeCapacity
          show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true

monitoring:
  check-interval: 15s
  timeout: 2s
  max-in-flight: 10
  batch-size: 50
  claim-tick-ms: 5000
  # Capacity model (non-fatal): expectedMaxServices x expectedProbeLatency must be
  # <= maxInFlight x checkInterval x instanceCount, or the fleet is oversubscribed
  # (WARN + health detail, but the monitor still runs). instanceCount is the number
  # of status-api instances sharing the work-queue (set to 3 in docker-compose).
  # expectedProbeLatency is the expected AVERAGE probe latency — not the 2s
  # timeout, which is a worst-case bound.
  expected-max-services: 50
  expected-probe-latency: 1s
  instance-count: 1

logging:
  level:
    root: INFO
    dev.status: INFO
    org.springframework: WARN
    org.hibernate: WARN
